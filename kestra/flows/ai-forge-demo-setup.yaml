id: ai-forge-demo-setup
namespace: graystone

description: |
  Configure demo repositories, Git identity, and the demo web service.
  Does not reinstall the operating system.

inputs:
  - id: machine
    type: SELECT
    required: true
    defaults: daedalus-02
    values:
      - daedalus-02

tasks:
  - id: demo_setup
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      FORGE_MACHINE: "{{ inputs.machine }}"
      ANSIBLE_SSH_PIPELINING: "true"
    commands:
      - |
        set -eu
        test "$FORGE_MACHINE" = "daedalus-02"
        cd /home/nispoe/graystone/ai-forge/ansible
        ansible-playbook playbooks/demo-setup.yaml --limit "$FORGE_MACHINE"
