# DGX Spark isolated provisioning network

# Listen ONLY on the direct Ethernet interface
interface=enP7s7
bind-interfaces

# Do not provide DNS service
port=0


# Graystone AI Forge provisioning address plan:
#
# 10.10.10.1-9      Infrastructure/controllers
# 10.10.10.10-19    Temporary/unregistered DHCP clients
# 10.10.10.20-99    Registered AI Forge machines
# 10.10.10.100-254  Reserved
#
# Registered-machine reservations are generated from
# machines/*/machine.yaml. Do not add dhcp-host entries here manually.
dhcp-range=10.10.10.10,10.10.10.19,255.255.255.0,12h

# Generated registered-machine reservations
conf-file=/etc/dnsmasq.d/ai-forge-machines.conf

# Do not advertise a default gateway
dhcp-option=3

# Spark is the PXE/TFTP server
enable-tftp
tftp-root=/srv/pxe/tftp

# Useful DHCP logging while we're building this
log-dhcp

# Detect an iPXE client
dhcp-match=set:ipxe,175

# Detect x86-64 UEFI firmware
dhcp-match=set:efi64,option:client-arch,7

# First boot: UEFI firmware receives iPXE over TFTP
dhcp-boot=tag:efi64,tag:!ipxe,ipxe.efi

# Second boot: once iPXE is running, give it our HTTP script
dhcp-boot=tag:ipxe,http://10.10.10.1/pxe/boot.ipxe
