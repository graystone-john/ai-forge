---
- name: Define llama.cpp paths
  ansible.builtin.set_fact:
    llama_src: "{{ llama_runtime.source }}"
    ai_forge_bin: "/opt/ai-forge/bin"
    model_dst: "/opt/ai-forge/models/{{ model.directory }}"
    inference_service_unit: "{{ inference.service_name }}.service"

- name: Create AI Forge binary directory
  ansible.builtin.file:
    path: "{{ ai_forge_bin }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy llama.cpp binary from AI Forge artifact cache
  ansible.posix.synchronize:
    src: "{{ llama_src }}"
    dest: "{{ ai_forge_bin }}/llama"
    checksum: true
    rsync_path: "sudo -n rsync"
    rsync_opts:
      - "--chown=root:root"
      - "--no-perms"
      - "--no-times"
  delegate_to: localhost
  become: false

- name: Set llama.cpp binary permissions
  ansible.builtin.file:
    path: "{{ ai_forge_bin }}/llama"
    owner: root
    group: root
    mode: "0755"

- name: Verify llama.cpp binary checksum
  ansible.builtin.command:
    cmd: sha256sum "{{ ai_forge_bin }}/llama"
  register: llama_checksum
  changed_when: false

- name: Require expected llama.cpp checksum
  ansible.builtin.assert:
    that:
      - llama_runtime.checksum in llama_checksum.stdout
    fail_msg: "llama.cpp binary checksum mismatch"

- name: Link llama.cpp into system PATH
  ansible.builtin.file:
    src: "{{ ai_forge_bin }}/llama"
    dest: /usr/local/bin/llama
    state: link
    force: true

- name: Install inference systemd service
  ansible.builtin.template:
    src: ai-forge-inference.service.j2
    dest: "/etc/systemd/system/{{ inference_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: inference_service_template

- name: Reload systemd for inference service
  ansible.builtin.systemd:
    daemon_reload: true
  when: inference_service_template.changed

- name: Restart inference service after unit change
  ansible.builtin.systemd:
    name: "{{ inference_service_unit }}"
    state: restarted
  when: inference_service_template.changed

- name: Enable and start inference service
  ansible.builtin.systemd:
    name: "{{ inference_service_unit }}"
    enabled: true
    state: started

- name: Wait for inference HTTP port
  ansible.builtin.wait_for:
    host: "{{ inference.host }}"
    port: "{{ inference.port }}"
    timeout: 180

- name: Allow inference model to finish loading
  ansible.builtin.pause:
    seconds: 5

- name: Verify selected model is ready
  ansible.builtin.uri:
    url: "http://{{ inference.host }}:{{ inference.port }}/v1/models"
    method: GET
    return_content: true
    status_code: 200
  register: inference_models

- name: Require selected model in inference API
  ansible.builtin.assert:
    that:
      - model.id in (inference_models.content | string)
    fail_msg: "Selected model {{ model.id }} is not exposed by inference API"

- name: Report inference API
  ansible.builtin.debug:
    msg: "{{ inference_models.json | default(inference_models.content) }}"
