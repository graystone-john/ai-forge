---
- name: Define llama.cpp paths
  ansible.builtin.set_fact:
    llama_src: "/home/nispoe/graystone/provisioning-data/software/llama.cpp/llama"
    ai_forge_bin: "/opt/ai-forge/bin"

- name: Create AI Forge binary directory
  ansible.builtin.file:
    path: "{{ ai_forge_bin }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy llama.cpp binary from Athena
  ansible.posix.synchronize:
    src: "{{ llama_src }}"
    dest: "{{ ai_forge_bin }}/llama"
    checksum: true
    rsync_path: "sudo -n rsync"
  delegate_to: localhost
  become: false

- name: Set llama.cpp binary permissions
  ansible.builtin.file:
    path: "{{ ai_forge_bin }}/llama"
    owner: root
    group: root
    mode: "0755"

- name: Verify llama.cpp binary checksum
  ansible.builtin.command:
    cmd: sha256sum "{{ ai_forge_bin }}/llama"
  register: llama_checksum
  changed_when: false

- name: Require expected llama.cpp checksum
  ansible.builtin.assert:
    that:
      - "'7d692bc72fcb179b81e15c3ea5a20495230ce269ab5016d0a340f9864591cfd6' in llama_checksum.stdout"
    fail_msg: "llama.cpp binary checksum mismatch"

- name: Link llama.cpp into system PATH
  ansible.builtin.file:
    src: "{{ ai_forge_bin }}/llama"
    dest: /usr/local/bin/llama
    state: link
    force: true

- name: Install Muse inference systemd service
  ansible.builtin.template:
    src: ai-forge-muse.service.j2
    dest: /etc/systemd/system/ai-forge-muse.service
    owner: root
    group: root
    mode: "0644"
  register: muse_service_unit

- name: Reload systemd for Muse service
  ansible.builtin.systemd:
    daemon_reload: true
  when: muse_service_unit.changed

- name: Enable and start Muse inference service
  ansible.builtin.systemd:
    name: ai-forge-muse.service
    enabled: true
    state: started

- name: Wait for Muse HTTP port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8080
    timeout: 180

- name: Wait for Muse model to become ready
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/v1/models
    method: GET
    return_content: true
    status_code: 200
  register: muse_models
  retries: 60
  delay: 5
  until: muse_models.status == 200

- name: Report Muse API
  ansible.builtin.debug:
    msg: "{{ muse_models.json | default(muse_models.content) }}"
