---
- name: Verify approved kernel
  ansible.builtin.assert:
    that:
      - ansible_kernel == daedalus_kernel.version
    fail_msg: "Unexpected kernel: {{ ansible_kernel }}; expected {{ daedalus_kernel.version }}"

- name: Verify NVIDIA GPU
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
  register: validation_nvidia
  changed_when: false

- name: Verify inference service is active
  ansible.builtin.command:
    cmd: systemctl is-active {{ inference.service_name }}.service
  register: validation_service
  changed_when: false

- name: Require inference service
  ansible.builtin.assert:
    that:
      - validation_service.stdout == "active"

- name: Verify OpenAI models endpoint
  ansible.builtin.uri:
    url: "http://{{ inference.host }}:{{ inference.port }}/v1/models"
    method: GET
    return_content: true
    status_code: 200
  register: validation_models

- name: Verify chat completion
  ansible.builtin.uri:
    url: "http://{{ inference.host }}:{{ inference.port }}/v1/chat/completions"
    method: POST
    body_format: json
    body:
      model: "{{ model.id }}"
      messages:
        - role: user
          content: "Reply with exactly: AI_FORGE_OK"
      temperature: 0
      max_tokens: 256
    return_content: true
    status_code: 200
  register: validation_chat

- name: Require expected chat response
  ansible.builtin.assert:
    that:
      - "'AI_FORGE_OK' in validation_chat.json.choices[0].message.content"
    fail_msg: "Inference API did not return expected validation response"

- name: Run Aider connectivity smoke test
  ansible.builtin.shell: |
    sudo -u {{ agent_identity.user }} -H bash -lc '
      cd "$HOME"
      timeout 60s aider \
        --yes-always \
        --no-auto-commits \
        --message "Reply with exactly AI_FORGE_AIDER_OK. Do not edit any files."
    '
  args:
    executable: /bin/bash
  register: validation_aider
  changed_when: false

- name: Require expected Aider response
  ansible.builtin.assert:
    that:
      - "'AI_FORGE_AIDER_OK' in validation_aider.stdout"
    fail_msg: "Aider did not return expected validation response"

- name: Report full-stack validation
  ansible.builtin.debug:
    msg:
      - "Kernel: {{ ansible_kernel }}"
      - "GPU: {{ validation_nvidia.stdout }}"
      - "Inference service: {{ inference.service_name }} active"
      - "Model: {{ model.id }}"
      - "OpenAI-compatible API: working"
      - "Chat completion: working"
      - "Aider inference integration: working"
      - "AI Node: VALIDATED"

