---
- name: Define coding-agent paths
  ansible.builtin.set_fact:
    ai_forge_root: "/opt/ai-forge"
    aider_venv: "/opt/ai-forge/venvs/aider-{{ coding_agent.aider_version }}"
    ai_stores_apt_source: "/etc/apt/sources.list.d/90-graystone-ai-stores-coding.list"

- name: Create AI Forge coding-agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ai_forge_root }}"
    - "/opt/ai-forge/venvs"

- name: Prepare Ubuntu coding-agent dependencies
  ansible.builtin.include_tasks:
    file: coding-agent-dependencies-ubuntu.yaml
  when: ansible_distribution == "Ubuntu"

- name: Prepare Arch coding-agent dependencies
  ansible.builtin.include_tasks:
    file: coding-agent-dependencies-arch.yaml
  when: ansible_distribution == "Archlinux"

- name: Require supported coding-agent distribution
  ansible.builtin.assert:
    that:
      - ansible_distribution in ["Ubuntu", "Archlinux"]
    fail_msg: >-
      Unsupported coding-agent distribution:
      {{ ansible_distribution }}

- name: Read existing Aider virtual environment Python
  ansible.builtin.command:
    argv:
      - "{{ aider_venv }}/bin/python"
      - --version
  register: aider_venv_python
  changed_when: false
  failed_when: false

- name: Remove incompatible Aider virtual environment
  ansible.builtin.file:
    path: "{{ aider_venv }}"
    state: absent
  when:
    - aider_venv_python.rc != 0 or
      coding_agent.python_version not in aider_venv_python.stdout

- name: Create Aider virtual environment
  ansible.builtin.command:
    argv:
      - "{{ coding_agent_python }}"
      - -m
      - venv
      - "{{ aider_venv }}"
    creates: "{{ aider_venv }}/bin/python"

- name: Inspect effective pip configuration
  ansible.builtin.command:
    argv:
      - "{{ aider_venv }}/bin/python"
      - -m
      - pip
      - config
      - list
  register: aider_pip_config
  changed_when: false

- name: Require no configured secondary pip repository
  ansible.builtin.assert:
    that:
      - "'extra-index-url' not in aider_pip_config.stdout"
    fail_msg: >-
      A secondary pip index is configured.
      AI Stores provenance cannot be guaranteed.

- name: Record Aider installation start
  ansible.builtin.set_fact:
    aider_install_start_epoch: "{{ lookup('pipe', 'date +%s') }}"
    aider_install_start_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report Aider installation start
  ansible.builtin.debug:
    msg: >-
      AI Forge: Aider {{ coding_agent.aider_version }} installation
      started at {{ aider_install_start_time }}.
      Resolving recursively from Graystone AI Stores PyPI.

- name: Install Aider from Graystone AI Stores PyPI
  ansible.builtin.command:
    argv:
      - "{{ aider_venv }}/bin/python"
      - -m
      - pip
      - install
      - --index-url
      - "{{ ai_stores.pypi_index_url }}"
      - --trusted-host
      - "{{ ai_stores.trusted_host }}"
      - --disable-pip-version-check
      - "aider-chat=={{ coding_agent.aider_version }}"
  environment:
    PIP_NO_INDEX: ""
  register: aider_install
  changed_when: "'Successfully installed' in aider_install.stdout"

- name: Record Aider installation completion
  ansible.builtin.set_fact:
    aider_install_end_epoch: "{{ lookup('pipe', 'date +%s') }}"
    aider_install_end_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report Aider installation complete
  ansible.builtin.debug:
    msg: >-
      AI Forge: Aider {{ coding_agent.aider_version }} installation
      completed at {{ aider_install_end_time }}.
      Elapsed: {{
        (aider_install_end_epoch | int) -
        (aider_install_start_epoch | int)
      }} seconds.

- name: Link Aider into system PATH
  ansible.builtin.file:
    src: "{{ aider_venv }}/bin/aider"
    dest: /usr/local/bin/aider
    state: link
    force: true

- name: Verify Aider version
  ansible.builtin.command:
    cmd: aider --version
  register: aider_version
  changed_when: false

- name: Require configured Aider version
  ansible.builtin.assert:
    that:
      - "'aider ' ~ coding_agent.aider_version in aider_version.stdout"
    fail_msg: "Unexpected Aider version; expected {{ coding_agent.aider_version }}"

- name: Report coding-agent state
  ansible.builtin.debug:
    msg:
      - "Aider: {{ aider_version.stdout }}"

- name: Install AI Forge agent chat wrapper
  ansible.builtin.template:
    src: ai-forge-agent-chat.j2
    dest: /usr/local/bin/ai-forge-agent-chat
    owner: root
    group: root
    mode: "0755"

- name: Create Aider state directories for agent identity
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_identity.user }}"
    group: "{{ agent_identity.user }}"
    mode: "0755"
  loop:
    - "/home/{{ agent_identity.user }}/.aider"
    - "/home/{{ agent_identity.user }}/.aider/caches"

- name: Create coding workspace for agent identity
  ansible.builtin.file:
    path: "/home/{{ agent_identity.user }}/workspace"
    state: directory
    owner: "{{ agent_identity.user }}"
    group: "{{ agent_identity.user }}"
    mode: "0755"

- name: Configure Git default branch for agent identity
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ agent_identity.user }}"
      - env
      - "HOME=/home/{{ agent_identity.user }}"
      - git
      - config
      - --global
      - init.defaultBranch
      - main
    chdir: "/home/{{ agent_identity.user }}"
  changed_when: false

- name: Install Aider configuration for agent identity
  ansible.builtin.template:
    src: aider.conf.yml.j2
    dest: "/home/{{ agent_identity.user }}/.aider.conf.yml"
    owner: "{{ agent_identity.user }}"
    group: "{{ agent_identity.user }}"
    mode: "0600"

- name: Verify Aider configuration exists
  ansible.builtin.stat:
    path: "/home/{{ agent_identity.user }}/.aider.conf.yml"
  register: aider_config_file

- name: Require Aider configuration
  ansible.builtin.assert:
    that:
      - aider_config_file.stat.exists
    fail_msg: "Aider configuration was not installed"

- name: Allow AI Forge management account to launch agent chat
  ansible.builtin.template:
    src: ai-forge-agent-chat.sudoers.j2
    dest: /etc/sudoers.d/ai-forge-agent-chat
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

