---
- name: Require approved Daedalus kernel
  ansible.builtin.assert:
    that:
      - ansible_kernel == daedalus_kernel.version
    fail_msg: "Unexpected kernel {{ ansible_kernel }}; expected {{ daedalus_kernel.version }}"

- name: Hold kernel meta packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - linux-generic
    - linux-image-generic
    - linux-headers-generic

- name: Verify Intel Ethernet module exists
  ansible.builtin.command:
    cmd: modinfo -k "{{ daedalus_kernel.version }}" igc
  changed_when: false

- name: Verify Intel Wi-Fi module exists
  ansible.builtin.command:
    cmd: modinfo -k "{{ daedalus_kernel.version }}" iwlwifi
  changed_when: false
