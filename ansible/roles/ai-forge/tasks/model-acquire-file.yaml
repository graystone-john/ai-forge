---
- name: Default to Athena for this artifact
  ansible.builtin.set_fact:
    accelerator_artifact_ready: false

- name: Check accelerator artifact
  when: model_accelerator_available | bool
  block:
    - name: Verify accelerator artifact SHA-256
      ansible.builtin.stat:
        path: "{{ model_accelerator_directory }}/{{ item.filename }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: accelerator_artifact

    - name: Record accelerator artifact eligibility
      ansible.builtin.set_fact:
        accelerator_artifact_ready: >-
          {{
            accelerator_artifact.stat.isreg | default(false)
            and
            accelerator_artifact.stat.checksum | default('') == item.sha256
          }}

  rescue:
    - name: Report accelerator verification failure
      ansible.builtin.debug:
        msg: "Could not verify {{ item.filename }} on accelerator; using Athena."

- name: Acquire verified artifact from accelerator
  when: accelerator_artifact_ready | bool
  block:
    - name: Copy accelerator artifact to model cache
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import grp
            import hashlib
            import os
            from pathlib import Path
            import pwd
            import shutil
            import sys
            import tempfile

            source, target, user, group, expected = sys.argv[1:]
            destination = Path(target)
            uid = pwd.getpwnam(user).pw_uid
            gid = grp.getgrnam(group).gr_gid

            if destination.is_file() and not destination.is_symlink():
                with destination.open("rb") as stream:
                    current = hashlib.file_digest(stream, "sha256").hexdigest()
                if current == expected:
                    before = destination.stat()
                    changed = (
                        before.st_uid != uid or before.st_gid != gid
                        or before.st_mode & 0o7777 != 0o644
                    )
                    os.chown(destination, uid, gid)
                    os.chmod(destination, 0o644)
                    print("CHANGED" if changed else "UNCHANGED")
                    sys.exit(0)

            descriptor, temporary = tempfile.mkstemp(
                prefix=".ai-forge-model-", dir=destination.parent
            )
            os.close(descriptor)
            try:
                shutil.copyfile(source, temporary)
                os.chown(temporary, uid, gid)
                os.chmod(temporary, 0o644)
                os.replace(temporary, destination)
            finally:
                Path(temporary).unlink(missing_ok=True)
            print("CHANGED")
          - "{{ model_accelerator_directory }}/{{ item.filename }}"
          - "{{ item.destination }}"
          - "{{ inference.operational_user }}"
          - "{{ inference.operational_user }}"
          - "{{ item.sha256 }}"
      register: accelerator_local_copy
      changed_when: accelerator_local_copy.stdout | trim == 'CHANGED'

    - name: Verify model cache SHA-256
      ansible.builtin.stat:
        path: "{{ item.destination }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: accelerator_destination

    - name: Require verified local copy
      ansible.builtin.assert:
        that:
          - accelerator_destination.stat.checksum | default('') == item.sha256
        fail_msg: "Accelerator copy failed SHA-256 verification."

  rescue:
    - name: Fall back to Athena
      ansible.builtin.set_fact:
        accelerator_artifact_ready: false

- name: Acquire artifact from Athena
  ansible.builtin.get_url:
    url: >-
      {{ model.endpoint | regex_replace('/+$', '') }}/{{
      model.hf_repo }}/revisions/{{ model.revision }}/{{ item.filename }}
    dest: "{{ item.destination }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: "{{ inference.operational_user }}"
    group: "{{ inference.operational_user }}"
    mode: "0644"
    timeout: 120
  when: not (accelerator_artifact_ready | bool)

- name: Report artifact source
  ansible.builtin.debug:
    msg: >-
      {{ item.filename }}:
      {{ 'AI Stores Accelerator' if accelerator_artifact_ready | bool else 'Athena' }}
