---
- name: Default runtime acquisition to Athena
  ansible.builtin.set_fact:
    llama_accelerator_copied: false

- name: Try verified accelerator runtime
  when: inventory_hostname in ['daedalus-01', 'daedalus-02']
  block:
    - name: Mount existing accelerator
      ansible.builtin.include_tasks: ai-stores-accelerator-mount.yaml

    - name: Read runtime accelerator mount identity
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --raw
          - --output
          - UUID
          - --mountpoint
          - /mnt/ai-stores-accelerator
      register: llama_accelerator_mount
      changed_when: false
      failed_when: false

    - name: Inspect runtime on expected accelerator
      when:
        - llama_accelerator_mount.rc == 0
        - llama_accelerator_mount.stdout | trim == '87793e9a-50dc-4f4e-ad19-b8a6d42d7a3c'
      block:
        - name: Require a native vault archive path
          ansible.builtin.assert:
            that:
              - "'/vault/' in llama_prebuilt.archive"
              - "'..' not in llama_prebuilt.archive.split('/vault/', 1)[1].split('/')"

        - name: Define accelerator runtime archive
          ansible.builtin.set_fact:
            llama_accelerator_archive: >-
              /mnt/ai-stores-accelerator/vault/{{
              llama_prebuilt.archive.split('/vault/', 1)[1] }}

        - name: Verify cached runtime SHA256
          ansible.builtin.stat:
            path: "{{ llama_accelerator_archive }}"
            checksum_algorithm: sha256
          register: llama_accelerator_file

        - name: Copy matching accelerator runtime
          when:
            - llama_accelerator_file.stat.isreg | default(false)
            - llama_accelerator_file.stat.checksum | default('') == llama_prebuilt.archive_sha256
          block:
            - name: Copy runtime locally
              ansible.builtin.copy:
                src: "{{ llama_accelerator_archive }}"
                dest: "{{ llama_prebuilt.root }}/deploy/llama-runtime.tar.gz"
                remote_src: true
                owner: root
                group: root
                mode: "0644"

            - name: Verify locally copied runtime
              ansible.builtin.stat:
                path: "{{ llama_prebuilt.root }}/deploy/llama-runtime.tar.gz"
                checksum_algorithm: sha256
              register: llama_accelerator_destination

            - name: Require copied runtime checksum
              ansible.builtin.assert:
                that:
                  - llama_accelerator_destination.stat.checksum == llama_prebuilt.archive_sha256

            - name: Record successful accelerator acquisition
              ansible.builtin.set_fact:
                llama_accelerator_copied: true

  rescue:
    - name: Fall back after accelerator acquisition failure
      ansible.builtin.set_fact:
        llama_accelerator_copied: false

- name: Copy captured runtime from Athena
  ansible.builtin.copy:
    src: "{{ llama_prebuilt.archive }}"
    dest: "{{ llama_prebuilt.root }}/deploy/llama-runtime.tar.gz"
    owner: root
    group: root
    mode: "0644"
  when: not llama_accelerator_copied | bool

- name: Report runtime acquisition source
  ansible.builtin.debug:
    msg: "{{ 'Runtime archive acquired from accelerator SSD' if llama_accelerator_copied | bool else 'Runtime archive acquired from Athena' }}"
