---
- name: Define selected model paths
  ansible.builtin.set_fact:
    model_src: "/home/nispoe/graystone/provisioning-data/models/{{ model.directory }}"
    model_dst: "/opt/ai-forge/models/{{ model.directory }}"

- name: Create model directory
  ansible.builtin.file:
    path: "{{ model_dst }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy selected model from Athena
  ansible.posix.synchronize:
    src: "{{ model_src }}/"
    dest: "{{ model_dst }}/"
    archive: false
    recursive: true
    checksum: true
    rsync_path: "sudo -n rsync"
    rsync_opts:
      - "--chown=root:root"
      - "--no-perms"
      - "--no-times"
      - "--info=progress2"
  delegate_to: localhost
  become: false

- name: Verify model checksum
  ansible.builtin.command:
    cmd: sha256sum "{{ model_dst }}/{{ model.model_file }}"
  register: model_checksum
  changed_when: false

- name: Require expected model checksum
  ansible.builtin.assert:
    that:
      - model.checksum in model_checksum.stdout
    fail_msg: "Model checksum mismatch"

- name: Verify model projector checksum
  ansible.builtin.command:
    cmd: sha256sum "{{ model_dst }}/{{ model.projector_file }}"
  register: model_projector_checksum
  changed_when: false

- name: Require expected model projector checksum
  ansible.builtin.assert:
    that:
      - model.projector_checksum in model_projector_checksum.stdout
    fail_msg: "Model projector checksum mismatch"
