---
- name: Ensure agent workspace root exists
  ansible.builtin.file:
    path: "/home/{{ agent_identity.user }}/graystone"
    state: directory
    owner: "{{ agent_identity.user }}"
    group: "{{ agent_identity.user }}"
    mode: "0755"

- name: Check whether AI Forge repository is already cloned
  ansible.builtin.stat:
    path: "/home/{{ agent_identity.user }}/graystone/ai-forge/.git"
  register: agent_workspace_repo_before

- name: Clone AI Forge repository
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ agent_identity.user }}"
      - -H
      - git
      - clone
      - "{{ agent_workspace.repository }}"
      - "/home/{{ agent_identity.user }}/graystone/ai-forge"
  when: not agent_workspace_repo_before.stat.exists

- name: Verify AI Forge repository was cloned
  ansible.builtin.stat:
    path: "/home/{{ agent_identity.user }}/graystone/ai-forge/.git"
  register: agent_workspace_repo_after

- name: Require AI Forge repository
  ansible.builtin.assert:
    that:
      - agent_workspace_repo_after.stat.exists
      - agent_workspace_repo_after.stat.isdir
    fail_msg: >-
      AI Forge repository was not successfully cloned into the agent workspace.

- name: Verify AI Forge repository remote
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ agent_identity.user }}"
      - -H
      - git
      - -C
      - "/home/{{ agent_identity.user }}/graystone/ai-forge"
      - remote
      - get-url
      - origin
  register: agent_workspace_remote
  changed_when: false

- name: Require expected AI Forge repository remote
  ansible.builtin.assert:
    that:
      - agent_workspace_remote.stdout == agent_workspace.repository
    fail_msg: >-
      AI Forge repository exists but origin does not match
      {{ agent_workspace.repository }}.

- name: Verify agent workspace Git identity
  ansible.builtin.shell: |
    set -e
    test "$(sudo -u {{ agent_identity.user }} -H git config --global user.name)" = "{{ agent_identity.name }}"
    test "$(sudo -u {{ agent_identity.user }} -H git config --global user.email)" = "{{ agent_identity.email }}"
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify agent workspace repository status
  ansible.builtin.command:
    argv:
      - sudo
      - -u
      - "{{ agent_identity.user }}"
      - -H
      - git
      - -C
      - "/home/{{ agent_identity.user }}/graystone/ai-forge"
      - status
      - --short
  register: agent_workspace_status
  changed_when: false

- name: Require clean AI Forge workspace
  ansible.builtin.assert:
    that:
      - agent_workspace_status.stdout | length == 0
    fail_msg: "AI Forge workspace is not clean"

- name: Report agent workspace state
  ansible.builtin.debug:
    msg:
      - "Agent: {{ agent_identity.name }}"
      - "Workspace: /home/{{ agent_identity.user }}/graystone/ai-forge"
      - "Repository: {{ agent_workspace_remote.stdout }}"
      - "Git identity: {{ agent_identity.name }} <{{ agent_identity.email }}>"
      - "Workspace state: clean"
