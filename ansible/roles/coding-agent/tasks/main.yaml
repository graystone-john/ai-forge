---
- name: Define coding-agent artifact paths
  ansible.builtin.set_fact:
    aider_src: "{{ coding_agent.source }}"
    python_venv_src: "{{ coding_agent.python_venv_source }}"

    ai_forge_root: "/opt/ai-forge"
    aider_cache_dst: "/opt/ai-forge/python/aider-{{ coding_agent.aider_version }}"
    python_venv_dst: "/opt/ai-forge/packages/python-venv-3.12"
    aider_venv: "/opt/ai-forge/venvs/aider-{{ coding_agent.aider_version }}"

- name: Create AI Forge coding-agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ai_forge_root }}"
    - "/opt/ai-forge/python"
    - "{{ aider_cache_dst }}"
    - "/opt/ai-forge/packages"
    - "{{ python_venv_dst }}"
    - "/opt/ai-forge/venvs"

- name: Record Aider wheelhouse transfer start
  ansible.builtin.set_fact:
    aider_transfer_start_epoch: "{{ lookup('pipe', 'date +%s') }}"
    aider_transfer_start_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report Aider wheelhouse transfer start
  ansible.builtin.debug:
    msg: >-
      AI Forge: Aider wheelhouse transfer started at
      {{ aider_transfer_start_time }}.

- name: Copy Aider wheelhouse to AI Node
  ansible.posix.synchronize:
    src: "{{ aider_src }}/"
    dest: "{{ aider_cache_dst }}/"
    archive: false
    recursive: true
    checksum: true
    rsync_path: "sudo -n rsync"
    rsync_opts:
      - "--chown=root:root"
      - "--no-perms"
      - "--no-times"
  delegate_to: localhost
  become: false

- name: Record Aider wheelhouse transfer completion
  ansible.builtin.set_fact:
    aider_transfer_end_epoch: "{{ lookup('pipe', 'date +%s') }}"
    aider_transfer_end_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report Aider wheelhouse transfer complete
  ansible.builtin.debug:
    msg: >-
      AI Forge: Aider wheelhouse transfer completed at
      {{ aider_transfer_end_time }}.
      Elapsed: {{
        (aider_transfer_end_epoch | int) -
        (aider_transfer_start_epoch | int)
      }} seconds.

- name: Record Python venv bundle transfer start
  ansible.builtin.set_fact:
    python_venv_transfer_start_epoch: "{{ lookup('pipe', 'date +%s') }}"
    python_venv_transfer_start_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report Python venv bundle transfer start
  ansible.builtin.debug:
    msg: >-
      AI Forge: Python venv package bundle transfer started at
      {{ python_venv_transfer_start_time }}.

- name: Copy Python venv package bundle to AI Node
  ansible.posix.synchronize:
    src: "{{ python_venv_src }}/"
    dest: "{{ python_venv_dst }}/"
    archive: false
    recursive: true
    checksum: true
    rsync_path: "sudo -n rsync"
    rsync_opts:
      - "--chown=root:root"
      - "--no-perms"
      - "--no-times"
  delegate_to: localhost
  become: false

- name: Record Python venv bundle transfer completion
  ansible.builtin.set_fact:
    python_venv_transfer_end_epoch: "{{ lookup('pipe', 'date +%s') }}"
    python_venv_transfer_end_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report Python venv bundle transfer complete
  ansible.builtin.debug:
    msg: >-
      AI Forge: Python venv package bundle transfer completed at
      {{ python_venv_transfer_end_time }}.
      Elapsed: {{
        (python_venv_transfer_end_epoch | int) -
        (python_venv_transfer_start_epoch | int)
      }} seconds.

- name: Verify Python venv package bundle checksums
  ansible.builtin.command:
    cmd: sha256sum -c ../meta/SHA256SUMS
    chdir: "{{ python_venv_dst }}/packages"
  changed_when: false

- name: Check whether python3.12-venv is installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status}
      - python3.12-venv
  register: venv_package_status
  changed_when: false
  failed_when: false

- name: Install Python venv support from offline package bundle
  ansible.builtin.shell: |
    set -euo pipefail
    dpkg -i "{{ python_venv_dst }}"/packages/*.deb
  args:
    executable: /bin/bash
  when: "'install ok installed' not in venv_package_status.stdout"

- name: Check existing Aider virtual environment
  ansible.builtin.stat:
    path: "{{ aider_venv }}/bin/pip"
  register: aider_venv_pip

- name: Remove incomplete Aider virtual environment
  ansible.builtin.file:
    path: "{{ aider_venv }}"
    state: absent
  when: not aider_venv_pip.stat.exists

- name: Create Aider virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv "{{ aider_venv }}"
    creates: "{{ aider_venv }}/bin/python"

- name: Record Aider installation start
  ansible.builtin.set_fact:
    aider_install_start_epoch: "{{ lookup('pipe', 'date +%s') }}"
    aider_install_start_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report Aider installation start
  ansible.builtin.debug:
    msg: >-
      AI Forge: Aider {{ coding_agent.aider_version }} installation
      started at {{ aider_install_start_time }}.
      Installing from the offline wheelhouse.

- name: Install Aider from offline wheelhouse
  ansible.builtin.command:
    argv:
      - "{{ aider_venv }}/bin/python"
      - -m
      - pip
      - install
      - --no-index
      - --find-links
      - "{{ aider_cache_dst }}/wheels"
      - -r
      - "{{ aider_cache_dst }}/meta/requirements.lock"
  register: aider_install
  changed_when: "'Successfully installed' in aider_install.stdout"

- name: Record Aider installation completion
  ansible.builtin.set_fact:
    aider_install_end_epoch: "{{ lookup('pipe', 'date +%s') }}"
    aider_install_end_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report Aider installation complete
  ansible.builtin.debug:
    msg: >-
      AI Forge: Aider {{ coding_agent.aider_version }} installation
      completed at {{ aider_install_end_time }}.
      Elapsed: {{
        (aider_install_end_epoch | int) -
        (aider_install_start_epoch | int)
      }} seconds.

- name: Link Aider into system PATH
  ansible.builtin.file:
    src: "{{ aider_venv }}/bin/aider"
    dest: /usr/local/bin/aider
    state: link
    force: true

- name: Verify Aider version
  ansible.builtin.command:
    cmd: aider --version
  register: aider_version
  changed_when: false

- name: Require configured Aider version
  ansible.builtin.assert:
    that:
      - "'aider ' ~ coding_agent.aider_version in aider_version.stdout"
    fail_msg: "Unexpected Aider version; expected {{ coding_agent.aider_version }}"

- name: Report coding-agent state
  ansible.builtin.debug:
    msg:
      - "Aider: {{ aider_version.stdout }}"

- name: Install AI Forge agent chat wrapper
  ansible.builtin.template:
    src: ai-forge-agent-chat.j2
    dest: /usr/local/bin/ai-forge-agent-chat
    owner: root
    group: root
    mode: "0755"

- name: Install Aider configuration for agent identity
  ansible.builtin.template:
    src: aider.conf.yml.j2
    dest: "/home/{{ agent_identity.user }}/.aider.conf.yml"
    owner: "{{ agent_identity.user }}"
    group: "{{ agent_identity.user }}"
    mode: "0600"

- name: Verify Aider configuration exists
  ansible.builtin.stat:
    path: "/home/{{ agent_identity.user }}/.aider.conf.yml"
  register: aider_config_file

- name: Require Aider configuration
  ansible.builtin.assert:
    that:
      - aider_config_file.stat.exists
    fail_msg: "Aider configuration was not installed"

- name: Allow AI Forge management account to launch agent chat
  ansible.builtin.template:
    src: ai-forge-agent-chat.sudoers.j2
    dest: /etc/sudoers.d/ai-forge-agent-chat
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

