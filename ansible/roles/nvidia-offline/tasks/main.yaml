---
- name: Define NVIDIA offline bundle paths
  ansible.builtin.set_fact:
    nvidia_bundle_src: "/home/nispoe/graystone/provisioning-data/packages/{{ daedalus_nvidia.bundle_name }}"
    nvidia_bundle_dst: "/opt/ai-forge/packages/{{ daedalus_nvidia.bundle_name }}"

- name: Require approved kernel before NVIDIA install
  ansible.builtin.assert:
    that:
      - ansible_kernel == daedalus_kernel.version
    fail_msg: "NVIDIA offline role requires {{ daedalus_kernel.version }}"

- name: Create offline package directory
  ansible.builtin.file:
    path: "{{ nvidia_bundle_dst }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record NVIDIA bundle transfer start
  ansible.builtin.set_fact:
    nvidia_transfer_start_epoch: "{{ lookup('pipe', 'date +%s') }}"
    nvidia_transfer_start_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report NVIDIA bundle transfer start
  ansible.builtin.debug:
    msg: >-
      AI Forge: NVIDIA package bundle transfer started at
      {{ nvidia_transfer_start_time }}.

- name: Copy NVIDIA offline bundle to AI Node
  ansible.posix.synchronize:
    src: "{{ nvidia_bundle_src }}/"
    dest: "{{ nvidia_bundle_dst }}/"
    archive: false
    recursive: true
    checksum: true
    rsync_path: "sudo -n rsync"
    rsync_opts:
      - "--chown=root:root"
      - "--no-perms"
      - "--no-times"
  delegate_to: localhost
  become: false

- name: Record NVIDIA bundle transfer completion
  ansible.builtin.set_fact:
    nvidia_transfer_end_epoch: "{{ lookup('pipe', 'date +%s') }}"
    nvidia_transfer_end_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Report NVIDIA bundle transfer complete
  ansible.builtin.debug:
    msg: >-
      AI Forge: NVIDIA package bundle transfer completed at
      {{ nvidia_transfer_end_time }}.
      Elapsed: {{
        (nvidia_transfer_end_epoch | int) -
        (nvidia_transfer_start_epoch | int)
      }} seconds.

- name: Verify NVIDIA package bundle checksums
  ansible.builtin.command:
    cmd: sha256sum -c ../meta/SHA256SUMS
    chdir: "{{ nvidia_bundle_dst }}/packages"
  changed_when: false

- name: Check existing NVIDIA DKMS state
  ansible.builtin.command:
    cmd: dkms status
  register: existing_dkms_status
  changed_when: false
  failed_when: false

- name: Record NVIDIA installation start
  ansible.builtin.set_fact:
    nvidia_install_start_epoch: "{{ lookup('pipe', 'date +%s') }}"
    nvidia_install_start_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  when: "'nvidia/' ~ daedalus_nvidia.driver_version ~ ', ' ~ daedalus_kernel.version not in existing_dkms_status.stdout"

- name: Report NVIDIA installation start
  ansible.builtin.debug:
    msg: >-
      AI Forge: NVIDIA {{ daedalus_nvidia.driver_version }} installation
      started at {{ nvidia_install_start_time }}.
      DKMS compilation may take several minutes.
  when: "'nvidia/' ~ daedalus_nvidia.driver_version ~ ', ' ~ daedalus_kernel.version not in existing_dkms_status.stdout"

- name: Install offline NVIDIA package set
  ansible.builtin.shell: |
    set -euo pipefail
    apt-get install -y ./packages/*.deb
  args:
    chdir: "{{ nvidia_bundle_dst }}"
    executable: /bin/bash
  when: "'nvidia/' ~ daedalus_nvidia.driver_version ~ ', ' ~ daedalus_kernel.version not in existing_dkms_status.stdout"

- name: Record NVIDIA installation completion
  ansible.builtin.set_fact:
    nvidia_install_end_epoch: "{{ lookup('pipe', 'date +%s') }}"
    nvidia_install_end_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  when: "'nvidia/' ~ daedalus_nvidia.driver_version ~ ', ' ~ daedalus_kernel.version not in existing_dkms_status.stdout"

- name: Report NVIDIA installation complete
  ansible.builtin.debug:
    msg: >-
      AI Forge: NVIDIA installation completed at
      {{ nvidia_install_end_time }}.
      Elapsed: {{
        (nvidia_install_end_epoch | int) -
        (nvidia_install_start_epoch | int)
      }} seconds.
  when: "'nvidia/' ~ daedalus_nvidia.driver_version ~ ', ' ~ daedalus_kernel.version not in existing_dkms_status.stdout"

- name: Verify DKMS built NVIDIA for approved kernel
  ansible.builtin.command:
    cmd: dkms status
  register: dkms_status
  changed_when: false

- name: Require NVIDIA DKMS module for approved kernel
  ansible.builtin.assert:
    that:
      - "'nvidia/' ~ daedalus_nvidia.driver_version ~ ', ' ~ daedalus_kernel.version in dkms_status.stdout"
    fail_msg: "NVIDIA DKMS module was not built for {{ daedalus_kernel.version }}"

- name: Verify NVIDIA kernel module
  ansible.builtin.command:
    cmd: modinfo -k "{{ daedalus_kernel.version }}" nvidia
  changed_when: false

