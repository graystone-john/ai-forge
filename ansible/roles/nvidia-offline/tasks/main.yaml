---
- name: Define NVIDIA offline bundle paths
  ansible.builtin.set_fact:
    nvidia_bundle_src: "/home/nispoe/graystone/provisioning-data/packages/{{ daedalus_nvidia.bundle_name }}"
    nvidia_bundle_dst: "/opt/ai-forge/packages/{{ daedalus_nvidia.bundle_name }}"

- name: Require approved kernel before NVIDIA install
  ansible.builtin.assert:
    that:
      - ansible_kernel == daedalus_kernel.version
    fail_msg: "NVIDIA offline role requires {{ daedalus_kernel.version }}"

- name: Create offline package directory
  ansible.builtin.file:
    path: "{{ nvidia_bundle_dst }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy NVIDIA offline bundle to target
  ansible.posix.synchronize:
    src: "{{ nvidia_bundle_src }}/"
    dest: "{{ nvidia_bundle_dst }}/"
    archive: false
    recursive: true
    checksum: true
    rsync_path: "sudo -n rsync"
    rsync_opts:
      - "--chown=root:root"
      - "--no-perms"
      - "--no-times"
      - "--info=progress2"
  delegate_to: localhost
  become: false

- name: Verify NVIDIA package bundle checksums
  ansible.builtin.command:
    cmd: sha256sum -c ../meta/SHA256SUMS
    chdir: "{{ nvidia_bundle_dst }}/packages"
  changed_when: false

- name: Check existing NVIDIA DKMS state
  ansible.builtin.command:
    cmd: dkms status
  register: existing_dkms_status
  changed_when: false
  failed_when: false

- name: Install offline NVIDIA package set
  ansible.builtin.shell: |
    set -euo pipefail
    apt-get install -y ./packages/*.deb
  args:
    chdir: "{{ nvidia_bundle_dst }}"
    executable: /bin/bash
  when: "'nvidia/' ~ daedalus_nvidia.driver_version ~ ', ' ~ daedalus_kernel.version not in existing_dkms_status.stdout"

- name: Verify DKMS built NVIDIA for approved kernel
  ansible.builtin.command:
    cmd: dkms status
  register: dkms_status
  changed_when: false

- name: Require NVIDIA DKMS module for approved kernel
  ansible.builtin.assert:
    that:
      - "'nvidia/' ~ daedalus_nvidia.driver_version ~ ', ' ~ daedalus_kernel.version in dkms_status.stdout"
    fail_msg: "NVIDIA DKMS module was not built for {{ daedalus_kernel.version }}"

- name: Verify NVIDIA kernel module
  ansible.builtin.command:
    cmd: modinfo -k "{{ daedalus_kernel.version }}" nvidia
  changed_when: false

