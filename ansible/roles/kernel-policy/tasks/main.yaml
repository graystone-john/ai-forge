---
- name: Require approved Daedalus kernel
  ansible.builtin.assert:
    that:
      - ansible_kernel == "6.8.0-100-generic"
    fail_msg: "Unexpected kernel {{ ansible_kernel }}; expected 6.8.0-100-generic"

- name: Hold kernel meta packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - linux-generic
    - linux-image-generic
    - linux-headers-generic

- name: Verify Intel Ethernet module exists
  ansible.builtin.command:
    cmd: modinfo -k 6.8.0-100-generic igc
  changed_when: false

- name: Verify Intel Wi-Fi module exists
  ansible.builtin.command:
    cmd: modinfo -k 6.8.0-100-generic iwlwifi
  changed_when: false
