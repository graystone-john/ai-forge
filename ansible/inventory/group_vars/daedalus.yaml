ansible_user: ai-forge
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'

ai_forge_family: daedalus
ai_forge_role: local-ai-coding-node

daedalus_kernel:
  version: "6.8.0-100-generic"

daedalus_nvidia:
  driver_version: "595.84"
  package: "nvidia-driver-595-open"
  package_version: "595.84-0ubuntu0.24.04.1"
  apt_repository: "http://10.10.10.1:81/ai-stores/vault/linux/ubuntu/apt"

daedalus_network:
  wifi_interface: wlp8s0

agent_identity:
  user: daedalus
  name: Daedalus
  email: daedalus@graystone.systems

agent_credentials:
  github_private_key: "{{ playbook_dir }}/../../secrets/agents/daedalus/id_ed25519_github"
  github_public_key: "{{ playbook_dir }}/../../secrets/agents/daedalus/id_ed25519_github.pub"

agent_workspace:
  repository: git@github.com:graystone-john/ai-forge.git
