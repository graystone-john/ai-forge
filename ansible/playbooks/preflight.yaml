---
- name: AI Node preflight
  hosts: daedalus
  gather_facts: true

  tasks:
    - name: Select preflight for detected operating system
      ansible.builtin.set_fact:
        ai_forge_preflight_os: >-
          {{
            'ubuntu'
            if ansible_distribution == 'Ubuntu'
            else 'arch'
            if ansible_distribution == 'Archlinux'
            else 'unsupported'
          }}

    - name: Require supported operating system
      ansible.builtin.assert:
        that:
          - ai_forge_preflight_os != "unsupported"
        fail_msg: >-
          Unsupported operating system:
          {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Run operating-system preflight
      ansible.builtin.include_tasks:
        file: "../tasks/preflight/{{ ai_forge_preflight_os }}.yaml"

    - name: Run common preflight
      ansible.builtin.include_tasks:
        file: "../tasks/preflight/common.yaml"
