---
- name: AI Node preflight
  hosts: daedalus
  gather_facts: true

  tasks:
    - name: Read AI Forge machine configuration
      ansible.builtin.set_fact:
        ai_forge_machine_config: >-
          {{
            lookup(
              'file',
              '../../machines/' ~ inventory_hostname ~ '/machine.yaml'
            ) | from_yaml
          }}

    - name: Require declared operating system
      ansible.builtin.assert:
        that:
          - ai_forge_machine_config.os is defined
          - ai_forge_machine_config.os.distribution is defined
          - ai_forge_machine_config.os.version is defined
        fail_msg: >-
          Machine configuration must define os.distribution and os.version

    - name: Select version-specific preflight
      ansible.builtin.set_fact:
        ai_forge_preflight_file: >-
          preflight-{{
            ai_forge_machine_config.os.distribution
          }}-{{
            ai_forge_machine_config.os.version
          }}.yaml

    - name: Verify version-specific preflight exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../tasks/{{ ai_forge_preflight_file }}"
      delegate_to: localhost
      become: false
      register: preflight_implementation

    - name: Require version-specific preflight
      ansible.builtin.assert:
        that:
          - preflight_implementation.stat.exists
        fail_msg: >-
          No validated preflight implementation exists for
          {{ ai_forge_machine_config.os.distribution }}
          {{ ai_forge_machine_config.os.version }}.
          Expected {{ ai_forge_preflight_file }}.

    - name: Run version-specific preflight
      ansible.builtin.include_tasks:
        file: "../tasks/{{ ai_forge_preflight_file }}"
