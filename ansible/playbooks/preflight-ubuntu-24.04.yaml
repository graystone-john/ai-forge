---
- name: AI Node preflight - Ubuntu 24.04
  hosts: daedalus
  gather_facts: true

  tasks:
    - name: Verify Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version == "24"
        fail_msg: >-
          Expected Ubuntu 24.04, found
          {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Verify Netplan configuration
      ansible.builtin.stat:
        path: /etc/netplan/50-cloud-init.yaml
      register: provisioning_network_config

    - name: Require Netplan configuration
      ansible.builtin.assert:
        that:
          - provisioning_network_config.stat.exists
        fail_msg: "Expected Ubuntu Netplan configuration not found"

    - name: Verify provisioning Ethernet exists
      ansible.builtin.stat:
        path: /sys/class/net/{{ provisioning.interface }}
      register: provisioning_nic

    - name: Require provisioning Ethernet
      ansible.builtin.assert:
        that:
          - provisioning_nic.stat.exists
        fail_msg: "Provisioning interface {{ provisioning.interface }} not found"

    - name: Report preflight result
      ansible.builtin.debug:
        msg:
          - "Machine: {{ inventory_hostname }}"
          - "Desired OS: Ubuntu 24.04"
          - "Detected OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Provisioning interface: {{ provisioning.interface }}"
