---
- name: Configure full Daedalus coding node
  hosts: daedalus
  gather_facts: true
  become: true

  vars_files:
    - ../../secrets/local.yaml

  roles:
    - daedalus-base
    - kernel-policy
    - network
    - utilities
    - nvidia-offline
    - model
    - llama-runtime
    - coding-agent

    - role: validate-coding-node
      when: ai_forge_run_validation | default(true) | bool
