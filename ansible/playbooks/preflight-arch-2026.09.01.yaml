---
- name: AI Node preflight - Arch 2026.09.01
  hosts: daedalus
  gather_facts: true

  tasks:
    - name: Require Daedalus architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: >-
          Daedalus requires x86_64; detected
          {{ ansible_architecture }}

    - name: Verify Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Archlinux"
        fail_msg: >-
          Expected Arch Linux 2026.09.01 baseline, found
          {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Verify systemd-networkd provisioning configuration
      ansible.builtin.stat:
        path: /etc/systemd/network/20-ai-forge-provisioning.network
      register: provisioning_network_config

    - name: Require systemd-networkd provisioning configuration
      ansible.builtin.assert:
        that:
          - provisioning_network_config.stat.exists
        fail_msg: "Expected Arch provisioning network configuration not found"

    - name: Locate provisioning Ethernet by MAC
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            from pathlib import Path
            import sys

            expected = sys.argv[1].strip().lower()
            matches = [
                interface.name
                for interface in Path("/sys/class/net").iterdir()
                if (interface / "address").is_file()
                and (interface / "address").read_text().strip().lower() == expected
            ]
            if len(matches) != 1:
                raise SystemExit(
                    f"Expected exactly one provisioning NIC with MAC {expected}; "
                    f"found {matches}"
                )
            print(matches[0])
          - "{{ provisioning.mac }}"
      register: arch_provisioning_interface_lookup
      changed_when: false

    - name: Record provisioning Ethernet interface
      ansible.builtin.set_fact:
        arch_provisioning_interface: "{{ arch_provisioning_interface_lookup.stdout | trim }}"

    - name: Report preflight result
      ansible.builtin.debug:
        msg:
          - "Machine: {{ inventory_hostname }}"
          - "Desired OS: Arch 2026.09.01"
          - "Detected OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Provisioning interface: {{ arch_provisioning_interface }}"
