---
- name: Validate AI Node
  hosts: daedalus
  gather_facts: true
  become: true

  vars_files:
    - "../profiles/inference/{{ inference_profile }}.yaml"

  pre_tasks:
    - name: Report AI Forge stage start
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_START name=validate-ai-node machine={{ inventory_hostname }}"

  roles:
    - validate-coding-node

  post_tasks:
    - name: Report AI Forge stage complete
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_COMPLETE name=validate-ai-node machine={{ inventory_hostname }}"
