---
- name: Verify AI Node after reboot - Arch 2026.09.01
  hosts: daedalus
  gather_facts: true
  become: true

  pre_tasks:
    - name: Report AI Forge stage start
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_START name=post-reboot-validation-arch-2026.09.01 machine={{ inventory_hostname }}"

  tasks:
    - name: Require Arch Linux and approved kernel after reboot
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Archlinux"
          - ansible_kernel == "7.2.7-arch1-1"
        fail_msg: >-
          Expected Arch Linux with kernel
          7.2.7-arch1-1; found
          {{ ansible_distribution }}
          {{ ansible_kernel }}

    - name: Require active NVIDIA GPU after reboot
      ansible.builtin.command:
        cmd: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
      register: active_gpu
      changed_when: false

    - name: Locate Wi-Fi interface by MAC address
      ansible.builtin.shell:
        cmd: |
          for interface in /sys/class/net/*; do
              [ -f "$interface/address" ] || continue
              if [ "$(cat "$interface/address")" = "{{ daedalus_network.wifi_mac | lower }}" ]; then
                  basename "$interface"
                  exit 0
              fi
          done
          exit 1
      register: arch_wifi_interface_lookup
      changed_when: false

    - name: Record Wi-Fi interface
      ansible.builtin.set_fact:
        arch_wifi_interface: "{{ arch_wifi_interface_lookup.stdout }}"

    - name: Verify AI Node Wi-Fi IPv4 address
      ansible.builtin.command:
        cmd: "ip -4 -o addr show dev {{ arch_wifi_interface }}"
      register: wifi_ipv4
      changed_when: false

    - name: Require AI Node Wi-Fi IPv4 address
      ansible.builtin.assert:
        that:
          - wifi_ipv4.stdout | trim | length > 0
        fail_msg: >-
          Wi-Fi interface {{ arch_wifi_interface }}
          does not have an IPv4 address

    - name: Verify AI Node Internet connectivity
      ansible.builtin.command:
        cmd: "ping -I {{ arch_wifi_interface }} -c 2 -W 3 1.1.1.1"
      changed_when: false

    - name: Verify AI Node DNS resolution
      ansible.builtin.command:
        cmd: getent ahostsv4 github.com
      changed_when: false

    - name: Report post-reboot AI Node state
      ansible.builtin.debug:
        msg:
          - "Kernel: {{ ansible_kernel }}"
          - "GPU: {{ active_gpu.stdout }}"
          - "Wi-Fi interface: {{ arch_wifi_interface }}"
          - "Wi-Fi IPv4: {{ wifi_ipv4.stdout }}"
          - "Internet: reachable"
          - "DNS: working"

  post_tasks:
    - name: Report AI Forge stage complete
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_COMPLETE name=post-reboot-validation-arch-2026.09.01 machine={{ inventory_hostname }}"
