---
- name: Configure AI Node agent workspace
  hosts: daedalus
  gather_facts: true
  become: true

  pre_tasks:
    - name: Report AI Forge step start
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_START name=agent-workspace machine={{ inventory_hostname }}"

  roles:
    - agent-workspace

  post_tasks:
    - name: Report AI Forge step complete
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_COMPLETE name=agent-workspace machine={{ inventory_hostname }}"
