---
- name: Configure AI Node base and GPU
  hosts: daedalus
  gather_facts: true
  become: true

  vars_files:
    - ../../secrets/local.yaml

  pre_tasks:
    - name: Report AI Forge stage start
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_START name=base-system machine={{ inventory_hostname }}"

  roles:
    - role: ai-forge
      vars:
        ai_forge_stage: base-system

  post_tasks:
    - name: Report AI Forge stage complete
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_COMPLETE name=base-system machine={{ inventory_hostname }}"
