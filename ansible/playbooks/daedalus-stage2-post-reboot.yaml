---
- name: Verify AI Node after GPU reboot
  hosts: daedalus
  gather_facts: true
  become: true

  pre_tasks:
    - name: Report AI Forge stage start
      ansible.builtin.debug:
        msg: "AI_FORGE_STAGE_START stage=2 name=post-reboot-gpu-check machine={{ inventory_hostname }}"

  tasks:
    - name: Require approved kernel after reboot
      ansible.builtin.assert:
        that:
          - ansible_kernel == daedalus_kernel.version

    - name: Require active NVIDIA GPU after reboot
      ansible.builtin.command:
        cmd: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
      register: active_gpu
      changed_when: false

    - name: Report post-reboot AI Node state
      ansible.builtin.debug:
        msg:
          - "Kernel: {{ ansible_kernel }}"
          - "GPU: {{ active_gpu.stdout }}"

  post_tasks:
    - name: Report AI Forge stage complete
      ansible.builtin.debug:
        msg: "AI_FORGE_STAGE_COMPLETE stage=2 name=post-reboot-gpu-check machine={{ inventory_hostname }}"
