---
- name: Configure AI Node coding agent
  hosts: daedalus
  gather_facts: true
  become: true

  vars_files:
    - "../profiles/inference/{{ inference_profile }}.yaml"

  pre_tasks:
    - name: Report AI Forge stage start
      ansible.builtin.debug:
        msg: "AI_FORGE_STAGE_START stage=4 name=coding-agent machine={{ inventory_hostname }}"

  roles:
    - agent-identity
    - coding-agent

  post_tasks:
    - name: Report AI Forge stage complete
      ansible.builtin.debug:
        msg: "AI_FORGE_STAGE_COMPLETE stage=4 name=coding-agent machine={{ inventory_hostname }}"
