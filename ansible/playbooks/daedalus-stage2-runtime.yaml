---
- name: Configure Daedalus inference runtime
  hosts: daedalus
  gather_facts: true
  become: true

  vars_files:
    - "../profiles/inference/{{ inference_profile }}.yaml"

  pre_tasks:
    - name: Require NVIDIA to be active after reboot
      ansible.builtin.command:
        cmd: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      register: active_nvidia
      changed_when: false

    - name: Report active NVIDIA state
      ansible.builtin.debug:
        msg: "{{ active_nvidia.stdout }}"

  roles:
    - llama-runtime
