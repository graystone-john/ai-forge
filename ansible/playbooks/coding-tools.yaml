---
- name: Configure AI Node coding agent
  hosts: daedalus
  gather_facts: true
  become: true

  vars_files:
    - "../profiles/inference/{{ inference_profile }}.yaml"

  pre_tasks:
    - name: Report AI Forge stage start
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_START name=coding-tools machine={{ inventory_hostname }}"

  roles:
    - coding-agent

  post_tasks:
    - name: Report AI Forge stage complete
      ansible.builtin.debug:
        msg: "AI_FORGE_STEP_COMPLETE name=coding-tools machine={{ inventory_hostname }}"
